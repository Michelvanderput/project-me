name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project ProjectMe.xcodeproj \
            -scheme ProjectMe \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning: .*(Sendable|isolat)|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
